name: Weekly basketball results

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Script uitvoeren
        run: python fetch_weekly_results.py

      - name: Resultaten committen
        run: |
          git config user.name "basketbal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Automatische update: $(date +%F)"
          git push
